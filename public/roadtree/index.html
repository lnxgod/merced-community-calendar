<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1714">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="roadtree-api-origin" content="https://around-town-song-requests-api.bill-hatzer.chatgpt.site">
  <title>Page unavailable · Around Town</title>
  <link rel="icon" href="/assets/gamechangers-ai-logo.png">
  <link rel="stylesheet" href="/assets/holiday/holiday.css">
  <link rel="stylesheet" href="./picker.css?v=3">
  <script type="module" src="./picker.mjs?v=6"></script>
</head>
<body>
  <main class="wrap picker">
    <header class="brand">
      <img src="/assets/gamechangers-ai-logo.png" alt="" width="40" height="40">
      <span>Around Town <small>by GameChangers AI</small></span>
    </header>
    <section class="give" aria-labelledby="picker-title">
      <h1 id="picker-title">Page unavailable</h1>
      <form id="song-form" hidden>
        <p>At the show, tune your car radio to <strong>103.5 FM</strong>.</p>
        <label for="song">Choose a song to vote for</label>
        <select id="song" required>
          <option value="">Choose a song</option>
        </select>
        <button class="button primary" type="submit" disabled>Vote for this song</button>
        <p>Voting for a song already in line helps it move up. You can vote every five minutes and have one vote waiting at a time.</p>
      </form>
      <p id="picker-status" role="status"></p>
    </section>
  </main>
</body>
</html>
