<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06100f" />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('around-town-theme');
        } catch {
          // Keep the default dark theme when browser storage is unavailable.
        }
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#06100f' : '#ffffff');
      })();
    </script>
    <meta name="description" content="A community project from GameChangers AI, using AI to help neighbors discover events in Merced, Atwater and McSwain. Browse local listings and subscribe for free." />
    <title>Around Town by GameChangers AI — Merced, Atwater &amp; McSwain Community Calendar</title>
    <link rel="icon" type="image/png" href="/assets/gamechangers-ai-logo.png" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
